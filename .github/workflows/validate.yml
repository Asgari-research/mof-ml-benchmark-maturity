name: Validate publication repository

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate processed benchmark input
        run: python scripts/validate_release_data.py

      - name: Validate publication repository
        run: python scripts/validate_repository.py

      - name: Compile Python modules
        run: python -m compileall -q src scripts figure_regeneration
